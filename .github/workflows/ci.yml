# Continuous integration for pull requests and pushes to main.
#
# Runs the full quality gate (lint -> typecheck -> test -> build) on Linux,
# macOS, and Windows. The matrix exists because node-pty is a native module
# whose spawn-helper behavior is platform-specific (see the postinstall fix in
# scripts/ensure-node-pty-permissions.mjs), so a regression on one OS is not
# caught by the others.
#
# To make this gate actually block merges, enable branch protection on `main`:
#   Settings -> Branches -> Edit rule for `main`
#   -> "Require status checks to pass before merging"
#   -> select the `Quality (ubuntu-latest)`, `Quality (macos-latest)`,
#      `Quality (windows-latest)` checks
# 让该门禁真正阻止不合格 PR 合并,需在 main 分支保护规则里勾选
# "Require status checks to pass before merging" 并选中上面的三个 Quality 检查。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.1"

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Cache Bun's global package cache so repeated CI runs (e.g. each new
      # commit on a PR) skip re-downloading dependencies. Keyed on bun.lock,
      # so the cache rebuilds only when dependencies actually change.
      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # frozen-lockfile guarantees a reproducible install; if a contributor
      # edits package.json they must also update bun.lock locally.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public safety check
        run: bun run privacy:check

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck:src

      - name: Test
        run: bun test test

      - name: Build
        run: bun run build
